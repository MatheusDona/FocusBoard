<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusBoard - Cadastro</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="pagina-login">

  <div class="caixa-login">
    <h1>FocusBoard</h1>
    <p class="subtitulo">Crie sua conta</p>

    <form action="#" method="post">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="usuario">Nome de usuário</label>
      <input type="text" id="usuario" name="usuario" required>

      <label for="senha">Senha</label>
      <input type="password" id="senha" name="senha" minlength="8" required>

      <label for="confirmar_senha">Confirmar senha</label>
      <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="8" required>

      <button type="submit" class="botao">Criar conta</button>
    </form>

    <p class="link-baixo">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>

</body>
</html>
