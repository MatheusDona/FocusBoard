<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusBoard - Entrar</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="pagina-login">

  <div class="caixa-login">
    <h1>FocusBoard</h1>
    <p class="subtitulo">Entre para ver suas tarefas</p>

    <form id="form-login">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input type="password" id="senha" name="senha" autocomplete="current-password" required>
        <button type="button" class="alternar-senha" data-password-toggle="senha" aria-label="Mostrar senha" title="Mostrar senha">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="mensagem aviso mensagem-fixa" role="note">Verifique seu e-mail e confirme sua conta antes de fazer login.</div>
      <div id="mensagem-login" class="mensagem" role="alert" aria-live="polite"></div>
      <button type="submit" class="botao">Entrar</button>
    </form>

    <p class="link-baixo">Ainda não tem conta? <a href="cadastro.html">Cadastre-se</a></p>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
