services:
  - type: web
    name: focusboard-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /docs
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "60"
      - key: FRONTEND_URL
        value: http://127.0.0.1:5500
      - key: BACKEND_URL
        value: http://127.0.0.1:8000
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_REMETENTE
        sync: false
