<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FocusBoard - Cadastro</title>
  <link rel="stylesheet" href="../style.css">
</head>
<body class="pagina-login">

  <div class="caixa-login">
    <h1>FocusBoard</h1>
    <p class="subtitulo">Crie sua conta</p>

    <form id="form-cadastro">
      <label for="email">E-mail</label>
      <input type="email" id="email" name="email" required>

      <label for="usuario">Nome de usuário</label>
      <input type="text" id="usuario" name="usuario" required>

      <label for="senha">Senha</label>
      <div class="campo-senha">
        <input type="password" id="senha" name="senha" minlength="8" autocomplete="new-password" required>
        <button type="button" class="alternar-senha" data-password-toggle="senha" aria-label="Mostrar senha" title="Mostrar senha">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <label for="confirmar_senha">Confirmar senha</label>
      <div class="campo-senha">
        <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="8" autocomplete="new-password" required>
        <button type="button" class="alternar-senha" data-password-toggle="confirmar_senha" aria-label="Mostrar senha" title="Mostrar senha">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>

      <div class="mensagem aviso mensagem-fixa" role="note">Após fazer seu cadastro, confirme seu e-mail e depois faça login para entrar no FocusBoard.</div>
      <div id="mensagem-cadastro" class="mensagem" role="alert" aria-live="polite"></div>
      <button type="submit" class="botao">Criar conta</button>
    </form>

    <p class="link-baixo">Já tem conta? <a href="login.html">Entrar</a></p>
  </div>
  <script src="../js/api.js"></script>
  <script src="../js/cadastro.js"></script>
</body>
</html>
